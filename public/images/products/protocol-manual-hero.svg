<svg width="880" height="880" viewBox="0 0 880 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft warm studio ambient drop shadow -->
    <filter id="hero-shadow" x="140" y="80" width="600" height="740" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#121D2F" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#121D2F" flood-opacity="0.10" />
    </filter>

    <!-- Linen cover gradient -->
    <linearGradient id="hero-cover-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF9F3" />
      <stop offset="60%" stop-color="#F5EFE4" />
      <stop offset="100%" stop-color="#EDE4D5" />
    </linearGradient>

    <!-- Spine shadow gradient -->
    <linearGradient id="hero-spine-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#121D2F" stop-opacity="0.22" />
      <stop offset="25%" stop-color="#121D2F" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#121D2F" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#121D2F" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="studio-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F3EFE9" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Studio backdrop -->
  <rect width="880" height="880" fill="url(#studio-glow)" />

  <!-- Manual Book Object -->
  <g filter="url(#hero-shadow)">
    <!-- Exposed text block page block on right side (stacked 100 pages effect) -->
    <rect x="250" y="120" width="410" height="640" rx="6" fill="#EDE4D6" />
    <!-- Page edges lines -->
    <line x1="656" y1="130" x2="656" y2="750" stroke="#DFD5C4" stroke-width="1.5" />
    <line x1="653" y1="130" x2="653" y2="750" stroke="#E5DBCB" stroke-width="1.5" />
    <line x1="650" y1="130" x2="650" y2="750" stroke="#DFD5C4" stroke-width="1.5" />
    <line x1="647" y1="130" x2="647" y2="750" stroke="#E5DBCB" stroke-width="1.5" />

    <!-- Front Cover (Cream linen stock) -->
    <rect x="220" y="112" width="430" height="656" rx="5" fill="url(#hero-cover-cream)" stroke="#DDD3C2" stroke-width="1.5" />

    <!-- Spine depth and fold indent -->
    <rect x="220" y="112" width="42" height="656" fill="url(#hero-spine-gradient)" />
    <line x1="262" y1="112" x2="262" y2="768" stroke="#121D2F" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Embossed Border Frame -->
    <rect x="272" y="152" width="345" height="576" rx="2" fill="none" stroke="#121D2F" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="1 0" />
    <rect x="278" y="158" width="333" height="564" rx="1" fill="none" stroke="#121D2F" stroke-opacity="0.08" stroke-width="0.5" />

    <!-- CrownCalm Minimal Neural Gate Mark -->
    <g transform="translate(444, 235) scale(2.2)">
      <path d="M-8 -8 A10 10 0 0 0 -8 8" stroke="#121D2F" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M8 -8 A10 10 0 0 1 8 8" stroke="#121D2F" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <circle cx="0" cy="0" r="3" fill="#121D2F" />
    </g>

    <!-- Eyebrow Brand -->
    <text x="444" y="295" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="14" font-weight="700" letter-spacing="4" fill="#121D2F">CROWNCALM</text>

    <!-- Rule line with center diamond -->
    <line x1="360" y1="318" x2="528" y2="318" stroke="#121D2F" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="444" cy="318" r="2.5" fill="#121D2F" />

    <!-- Title: THE SANCTUARY PROTOCOL -->
    <text x="444" y="380" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" letter-spacing="1.5" fill="#121D2F">THE</text>
    <text x="444" y="426" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="700" letter-spacing="2" fill="#121D2F">SANCTUARY</text>
    <text x="444" y="472" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="700" letter-spacing="2.5" fill="#121D2F">PROTOCOL</text>

    <!-- Subtitle: Nervous System Operating Manual -->
    <text x="444" y="525" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" letter-spacing="2" fill="#2E3C52">NERVOUS SYSTEM OPERATING MANUAL</text>
    <text x="444" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.5" fill="#6A778B">CLINICAL MECHANISM GUIDANCE &amp; PACING CURVES</text>

    <!-- Clinical Features Strip -->
    <g transform="translate(325, 595)">
      <rect x="0" y="0" width="238" height="42" rx="4" fill="#121D2F" fill-opacity="0.04" stroke="#121D2F" stroke-opacity="0.1" stroke-width="0.75" />
      <text x="119" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#121D2F">100-PAGE COMPREHENSIVE TEXT</text>
      <text x="119" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="0.5" fill="#5A677B">5 Clinical Pillars · Calibration Journal · Lossless Audio</text>
    </g>

    <!-- Bottom Institutional Stamp -->
    <text x="444" y="690" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="11" font-weight="600" letter-spacing="1.8" fill="#121D2F">FIRST EDITION · CLINICAL RELEASE 2026</text>
  </g>
</svg>
