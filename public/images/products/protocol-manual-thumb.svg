<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft shadow for the flat-lay manual -->
    <filter id="manual-shadow" x="14" y="8" width="92" height="106" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#121D2F" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#121D2F" flood-opacity="0.1" />
    </filter>

    <!-- Spine gradient -->
    <linearGradient id="spine-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#121D2F" stop-opacity="0.12" />
      <stop offset="35%" stop-color="#121D2F" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#121D2F" stop-opacity="0.0" />
    </linearGradient>

    <!-- Paper sheen -->
    <linearGradient id="cover-cream" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#F2EBE1" />
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="120" height="120" rx="10" fill="#F4EFEB" />

  <!-- Manual Book Body with Drop Shadow -->
  <g filter="url(#manual-shadow)">
    <!-- Back pages edge / thickness effect -->
    <path d="M28 14H92C93.1 14 94 14.9 94 16V104C94 105.1 93.1 106 92 106H28V14Z" fill="#E8DFD3" />
    <line x1="93" y1="17" x2="93" y2="103" stroke="#D8CDBF" stroke-width="1" stroke-dasharray="1 1" />
    
    <!-- Front Cover -->
    <rect x="25" y="13" width="67" height="92" rx="2" fill="url(#cover-cream)" stroke="#E0D6C8" stroke-width="0.75" />

    <!-- Spine fold shadow -->
    <rect x="25" y="13" width="6" height="92" fill="url(#spine-gradient)" />
    <line x1="31" y1="13" x2="31" y2="105" stroke="#121D2F" stroke-opacity="0.08" stroke-width="0.75" />

    <!-- Top CrownCalm Gate Logomark -->
    <g transform="translate(58.5, 30) scale(0.65)">
      <!-- Left Gate Arc -->
      <path d="M-6 -6 A7 7 0 0 0 -6 6" stroke="#121D2F" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Right Gate Arc -->
      <path d="M6 -6 A7 7 0 0 1 6 6" stroke="#121D2F" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Focal Node -->
      <circle cx="0" cy="0" r="2.2" fill="#121D2F" />
    </g>

    <!-- Brand Label -->
    <text x="58.5" y="44" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="5" font-weight="700" letter-spacing="1.2" fill="#121D2F">CROWNCALM</text>

    <!-- Subtle divider rule -->
    <line x1="42" y1="49" x2="75" y2="49" stroke="#121D2F" stroke-opacity="0.25" stroke-width="0.5" />

    <!-- Title: THE SANCTUARY PROTOCOL -->
    <text x="58.5" y="58" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="6.8" font-weight="700" letter-spacing="0.2" fill="#121D2F">THE</text>
    <text x="58.5" y="66" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="7.2" font-weight="700" letter-spacing="0.4" fill="#121D2F">SANCTUARY</text>
    <text x="58.5" y="74" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="6.8" font-weight="700" letter-spacing="0.6" fill="#121D2F">PROTOCOL</text>

    <!-- Subtitle -->
    <text x="58.5" y="83" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="3.4" font-weight="600" letter-spacing="0.6" fill="#4B586E">NERVOUS SYSTEM</text>
    <text x="58.5" y="87.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="3.4" font-weight="600" letter-spacing="0.6" fill="#4B586E">OPERATING MANUAL</text>

    <!-- Bottom spec badge -->
    <rect x="44" y="93" width="29" height="5" rx="1.5" fill="#121D2F" fill-opacity="0.06" />
    <text x="58.5" y="96.8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="2.8" font-weight="700" letter-spacing="0.5" fill="#121D2F">100 PAGES · CLINICAL</text>
  </g>
</svg>
